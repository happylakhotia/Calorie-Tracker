<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="nt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3D2C" />
      <stop offset="50%" stop-color="#2D5A43" />
      <stop offset="100%" stop-color="#3D7A5B" />
    </linearGradient>
    <filter id="nt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Modern squircle container -->
  <rect width="32" height="32" rx="8" fill="url(#nt-grad)" />

  <!-- Subtle inner border highlight -->
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1" />

  <!-- NutriTrack Leaf Icon -->
  <g transform="translate(4, 4)" filter="url(#nt-shadow)">
    <!-- Leaf Body -->
    <path
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
      fill="rgba(255, 255, 255, 0.2)"
      stroke="#FFFFFF"
      stroke-width="2.1"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Leaf Stem / Vein -->
    <path
      d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.1"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Health Accent Dot -->
    <circle cx="18" cy="3.5" r="1.2" fill="#86EFAC" />
  </g>
</svg>